<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGEFREM | Paiement abonnement chargeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <section class="page-header">
            <div class="container">
                <h1 data-aos="fade-up">Paiement abonnement chargeur</h1>
                <p data-aos="fade-up" data-aos-delay="100">Module de paiement sécurisé en ligne</p>
                <div class="header-decoration" data-aos="fade-up" data-aos-delay="150"></div>
            </div>
        </section>

        <section class="service-content-section">
            <div class="container">
                <div class="row g-5">
                    <div class="col-lg-5" data-aos="fade-right">
                        <div class="payment-methods-card">
                            <h3><i class="fas fa-credit-card"></i> Moyens de paiement</h3>
                            <div class="payment-methods-list">
                                <div class="payment-method-item"><i class="fas fa-mobile-alt"></i> Mobile Money (M-Pesa, Orange Money)</div>
                                <div class="payment-method-item"><i class="fas fa-credit-card"></i> Carte bancaire (Visa, Mastercard)</div>
                                <div class="payment-method-item"><i class="fas fa-university"></i> Virement bancaire</div>
                                <div class="payment-method-item"><i class="fas fa-money-bill-wave"></i> Espèce (guichet OGEFREM)</div>
                            </div>
                            <div class="security-badge"><i class="fas fa-shield-alt"></i> Paiement 100% sécurisé</div>
                        </div>
                    </div>
                    <div class="col-lg-7" data-aos="fade-left">
                        <div class="payment-form-card">
                            <h3><i class="fas fa-calculator"></i> Paiement en ligne</h3>
                            <form id="paymentForm">
                                <div class="form-group"><label>Type d'abonnement</label>
                                    <select class="form-select" id="abonnement">
                                        <option value="50">Chargeur mensuel - 50 USD</option>
                                        <option value="135">Chargeur trimestriel - 135 USD</option>
                                        <option value="480">Chargeur annuel - 480 USD</option>
                                        <option value="100">Mandataire/Transitaire - 100 USD/mois</option>
                                    </select>
                                </div>
                                <div class="form-group"><label>Nom de l'entreprise</label><input type="text" id="entreprise" class="form-control" required></div>
                                <div class="form-group"><label>Numéro FERI (si applicable)</label><input type="text" id="feri" class="form-control"></div>
                                <div class="form-group"><label>Email de réception de la facture</label><input type="email" id="email" class="form-control" required></div>
                                <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fas fa-lock"></i> Payer maintenant</button>
                            </form>
                            <div id="paymentStatus" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/admin-data.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AOS.init({ duration: 800, once: true });
            
            document.getElementById('paymentForm')?.addEventListener('submit', function(e) {
                e.preventDefault();
                const montant = document.getElementById('abonnement').value;
                document.getElementById('paymentStatus').innerHTML = `<div class="alert alert-info">🔐 Redirection vers la plateforme de paiement sécurisé pour un montant de ${montant} USD...</div>`;
                setTimeout(() => {
                    alert('Paiement simulé. Dans un environnement réel, vous seriez redirigé vers la plateforme de paiement.');
                    document.getElementById('paymentStatus').innerHTML = '';
                }, 2000);
            });
        });
    </script>
</body>
</html>
