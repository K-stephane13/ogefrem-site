<!-- offres-transport.html - VERSION BILINGUE -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGEFREM | Offres de transport</title>

    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <section class="page-header">
            <div class="container">
                <h1 data-aos="fade-up" data-fr="Offres de transport" data-en="Transport Offers">Offres de transport</h1>
                <p data-aos="fade-up" data-aos-delay="100" data-fr="Annonces des transporteurs agréés pour vos expéditions" data-en="Listings from approved carriers for your shipments">Annonces des transporteurs agréés pour vos expéditions</p>
                <div class="header-decoration" data-aos="fade-up" data-aos-delay="150"></div>
            </div>
        </section>

        <section class="service-content-section">
            <div class="container">
                <div class="row g-4" id="offresContainer">
                    <!-- Chargé dynamiquement depuis AdminData.getOffres() -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/admin-data.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/main.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        AOS.init({ duration: 800, once: true });
        
        let currentLang = localStorage.getItem('ogefrem_lang') || 'fr';
        
        function updatePageLanguage(lang) {
            document.querySelectorAll('[data-fr][data-en]').forEach(el => {
                if (lang === 'fr' && el.dataset.fr) {
                    el.textContent = el.dataset.fr;
                } else if (lang === 'en' && el.dataset.en) {
                    el.textContent = el.dataset.en;
                }
            });
        }
        
        const langObserver = new MutationObserver(function() {
            const newLang = localStorage.getItem('ogefrem_lang') || 'fr';
            if (newLang !== currentLang) {
                currentLang = newLang;
                updatePageLanguage(currentLang);
            }
        });
        langObserver.observe(document.documentElement, { childList: true, subtree: true });
        
        setTimeout(function() {
            updatePageLanguage(currentLang);
        }, 500);
        
        // Load offers
        const offres = AdminData.getOffres();
        const container = document.getElementById('offresContainer');
        
        if (container && offres.length > 0) {
            container.innerHTML = offres.map((offre, index) => {
                let iconClass = 'fa-truck';
                if (offre.type === 'Maritime') iconClass = 'fa-ship';
                else if (offre.type === 'Aérien') iconClass = 'fa-plane';
                else if (offre.type === 'Ferroviaire') iconClass = 'fa-train';
                
                return `
                    <div class="col-md-6 col-lg-4" data-aos="fade-up" data-aos-delay="${(index + 1) * 100}">
                        <div class="offre-card">
                            <div class="offre-header">
                                <i class="fas ${iconClass}"></i>
                                <h3>${offre.titre}</h3>
                            </div>
                            <div class="offre-body">
                                <p><i class="fas fa-map-marker-alt"></i> ${offre.origine} → ${offre.destination}</p>
                                ${offre.capacite ? `<p><i class="fas fa-weight-hanging"></i> <span data-fr="Capacité :" data-en="Capacity:">Capacité :</span> ${offre.capacite}</p>` : ''}
                                ${offre.tarif ? `<p><i class="fas fa-tag"></i> <span data-fr="Tarif :" data-en="Rate:">Tarif :</span> ${offre.tarif}</p>` : ''}
                                ${offre.description ? `<p><i class="fas fa-info-circle"></i> ${offre.description}</p>` : ''}
                                <span class="offre-type ${offre.type.toLowerCase()}">${offre.type}</span>
                            </div>
                            <div class="offre-footer">
                                <button class="btn btn-primary btn-sm w-100" onclick="alert('${currentLang === 'fr' ? 'Contacter' : 'Contact'} ${offre.titre}: ${offre.contact || (currentLang === 'fr' ? 'Contact non disponible' : 'Contact not available')}')">
                                    <i class="fas fa-phone"></i> <span data-fr="Contacter" data-en="Contact">Contacter</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = `
                <div class="col-12 text-center">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> <span data-fr="Aucune offre de transport disponible pour le moment." data-en="No transport offers available at the moment.">Aucune offre de transport disponible pour le moment.</span>
                    </div>
                </div>
            `;
        }
    });
    </script>
</body>
</html>
