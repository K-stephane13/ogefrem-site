<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGEFREM - Administration</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f0f2f5; 
            overflow-x: hidden;
        }

        /* ============================================================
           LOGIN PAGE
           ============================================================ */
        .login-container { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, #003399, #0066CC); 
            padding: 20px; 
        }
        .login-card { 
            background: #fff; 
            border-radius: 24px; 
            padding: clamp(30px, 5vw, 50px); 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.3); 
        }
        .login-card .logo { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .login-card .logo img { 
            height: clamp(50px, 8vw, 70px); 
        }
        .login-card .logo h2 { 
            color: #003399; 
            font-size: clamp(1.3rem, 3vw, 1.8rem); 
            margin-top: 10px; 
        }
        .login-card .logo p { 
            color: #666; 
            font-size: clamp(0.85rem, 1.5vw, 1rem); 
        }

        /* ============================================================
           CHAMP MOT DE PASSE AVEC OEIL
           ============================================================ */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 50px;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 6px;
            transition: color 0.2s ease;
            z-index: 2;
            line-height: 1;
        }
        .password-toggle:hover {
            color: #003399;
        }
        .password-toggle:focus {
            outline: none;
        }
        .password-toggle .fa-eye-slash {
            display: none;
        }
        .password-wrapper.show-password .password-toggle .fa-eye {
            display: none;
        }
        .password-wrapper.show-password .password-toggle .fa-eye-slash {
            display: inline-block;
        }

        /* ============================================================
           ADMIN LAYOUT
           ============================================================ */
        .admin-wrapper { 
            display: flex; 
            min-height: 100vh; 
            position: relative;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .admin-sidebar {
            width: 270px;
            background: #003399;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1050;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .admin-sidebar::-webkit-scrollbar { width: 4px; }
        .admin-sidebar::-webkit-scrollbar-thumb { background: #FFCC00; border-radius: 4px; }
        .admin-sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .admin-sidebar .logo { 
            padding: 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            text-align: center; 
            flex-shrink: 0;
        }
        .admin-sidebar .logo img { 
            height: 45px; 
            display: block; 
            margin: 0 auto 8px; 
        }
        .admin-sidebar .logo h3 { 
            color: #FFCC00; 
            font-size: 1rem; 
            margin: 0; 
            font-weight: 600;
        }

        .admin-sidebar .nav-menu {
            flex: 1;
            padding: 12px 0 20px;
            overflow-y: auto;
        }

        .admin-sidebar .nav-item { 
            padding: 12px 22px; 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            cursor: pointer; 
            border-left: 3px solid transparent; 
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .admin-sidebar .nav-item:hover { 
            background: rgba(255,255,255,0.08); 
            color: #fff; 
        }
        .admin-sidebar .nav-item.active { 
            background: rgba(255,204,0,0.15); 
            border-left-color: #FFCC00; 
            color: #fff;
        }
        .admin-sidebar .nav-item i { 
            width: 22px; 
            font-size: 1.1rem; 
            text-align: center;
            flex-shrink: 0;
        }
        .admin-sidebar .nav-item .nav-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .admin-sidebar .nav-item .nav-badge {
            margin-left: auto;
            background: #FFCC00;
            color: #003399;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .super-only { display: none; }

        /* ============================================================
           SIDEBAR FOOTER
           ============================================================ */
        .sidebar-footer {
            padding: 15px 22px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
            flex-shrink: 0;
        }

        /* ============================================================
           SIDEBAR TOGGLE
           ============================================================ */
        .sidebar-toggle {
            display: none;
            background: transparent;
            color: #003399;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
        }
        .sidebar-toggle:hover { 
            background: rgba(0,51,153,0.08); 
        }

        /* ============================================================
           OVERLAY
           ============================================================ */
        .sidebar-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 1040; 
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .admin-main {
            flex: 1;
            margin-left: 270px;
            padding: 20px 30px 40px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
            width: 100%;
            max-width: calc(100% - 270px);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .admin-header {
            background: #fff;
            border-radius: 16px;
            padding: 14px 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.95);
        }
        .admin-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-header .header-left h1 { 
            font-size: clamp(1rem, 2vw, 1.4rem); 
            margin: 0; 
            color: #003399; 
            font-weight: 700;
        }
        .admin-header .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .user-pill { 
            background: #f0f4ff; 
            border-radius: 999px; 
            padding: 6px 16px; 
            font-size: 0.85rem; 
            color: #003399;
            font-weight: 500;
        }
        .user-pill strong { color: #003399; }
        .user-pill .role-badge {
            background: #FFCC00;
            color: #003399;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-left: 6px;
            text-transform: uppercase;
        }
        .btn-change-password {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .btn-change-password:hover { background: #138496; }
        .btn-change-password i { margin-right: 6px; }

        .logout-btn { 
            background: #dc3545; 
            color: #fff; 
            border: none; 
            padding: 7px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .logout-btn:hover { background: #c82333; }
        .logout-btn i { margin-right: 6px; }

        /* ============================================================
           CARDS
           ============================================================ */
        .content-card { 
            background: #fff; 
            border-radius: 20px; 
            padding: clamp(15px, 2.5vw, 30px); 
            margin-bottom: 25px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .card-header-custom { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px solid #FFCC00; 
            flex-wrap: wrap; 
            gap: 12px; 
        }
        .card-header-custom h3 {
            font-size: clamp(1rem, 1.8vw, 1.2rem);
            font-weight: 700;
            color: #003399;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header-custom h3 .badge {
            font-size: 0.7rem;
            padding: 2px 12px;
        }
        .card-header-custom .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 16px; 
            margin-bottom: 30px; 
        }
        .stat-card-admin { 
            background: #fff; 
            border-radius: 16px; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card-admin:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        .stat-card-admin .stat-icon {
            font-size: 1.8rem;
            color: #003399;
            margin-bottom: 6px;
        }
        .stat-number-admin { 
            font-size: clamp(1.8rem, 3vw, 2.4rem); 
            font-weight: 800; 
            color: #FFCC00; 
            line-height: 1.2;
        }
        .stat-card-admin .stat-label {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
        }

        /* ============================================================
           TABLEAUX
           ============================================================ */
        .table-wrapper-scroll {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            margin: 10px 0 15px;
            border-radius: 12px;
            border: 1px solid #eef0f2;
            background: #fff;
        }
        .table-wrapper-scroll table {
            min-width: 600px;
            width: 100%;
            margin-bottom: 0;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table-wrapper-scroll table thead th {
            background: #003399;
            color: white;
            padding: 12px 16px;
            font-weight: 600;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 5;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .table-wrapper-scroll table tbody td {
            padding: 11px 16px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            color: #333;
            font-size: 0.85rem;
        }
        .table-wrapper-scroll table tbody tr:hover td {
            background: rgba(0,51,153,0.03);
        }
        .table-wrapper-scroll table tbody tr:last-child td {
            border-bottom: none;
        }
        .table-wrapper-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-wrapper-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .table-wrapper-scroll::-webkit-scrollbar-thumb { background: #003399; border-radius: 10px; }
        .table-wrapper-scroll::-webkit-scrollbar-thumb:hover { background: #FFCC00; }

        /* ============================================================
           BOUTONS
           ============================================================ */
        .btn-add { 
            background: #003399; 
            color: #fff; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-add:hover { 
            background: #FFCC00; 
            color: #003399; 
            transform: translateY(-1px);
        }
        .btn-add i { font-size: 0.9rem; }

        .btn-edit { 
            background: #FFCC00; 
            color: #003399; 
            border: none; 
            padding: 5px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-edit:hover { background: #e6b800; }

        .btn-delete { 
            background: #dc3545; 
            color: #fff; 
            border: none; 
            padding: 5px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-delete:hover { background: #c82333; }

        .btn-reset-password {
            background: #ffc107;
            color: #003399;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-reset-password:hover { background: #e0a800; }

        .btn-sm { padding: 4px 10px; font-size: 0.7rem; }

        /* ============================================================
           BADGES
           ============================================================ */
        .badge-primary { background: #003399; color: #fff; }
        .badge-warning { background: #ffc107; color: #003399; }
        .badge-success { background: #28a745; color: #fff; }
        .badge-secondary { background: #6c757d; color: #fff; }

        /* ============================================================
           SEARCH BOX
           ============================================================ */
        .search-box { 
            position: relative; 
            margin-bottom: 16px; 
            max-width: 100%;
        }
        .search-box i { 
            position: absolute; 
            left: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #999; 
            font-size: 0.9rem;
        }
        .search-box input { 
            padding-left: 45px; 
            border-radius: 50px; 
            border: 1px solid #e0e0e0;
            padding: 10px 20px 10px 45px;
            width: 100%;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
        }
        .search-box input:focus {
            border-color: #003399;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,51,153,0.1);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-custom { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.5); 
            z-index: 1100; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            backdrop-filter: blur(4px);
        }
        .modal-custom.active { display: flex; }
        .modal-content-custom { 
            background: #fff; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 760px; 
            max-height: 90vh; 
            overflow-y: auto; 
            padding: clamp(20px, 3vw, 35px); 
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-content-custom::-webkit-scrollbar { width: 4px; }
        .modal-content-custom::-webkit-scrollbar-thumb { background: #003399; border-radius: 4px; }

        .modal-header-custom { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #eee; 
            flex-wrap: wrap;
            gap: 10px;
        }
        .modal-header-custom h3 { 
            font-size: clamp(1.1rem, 2vw, 1.4rem); 
            color: #003399; 
            margin: 0;
            font-weight: 700;
        }
        .modal-header-custom .btn-close-modal {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s ease;
        }
        .modal-header-custom .btn-close-modal:hover { background: #c82333; }

        /* ============================================================
           FORMULAIRE
           ============================================================ */
        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.9rem;
            color: #333;
        }
        .form-group label i { 
            color: #003399; 
            margin-right: 6px; 
        }
        .form-group .required { color: #dc3545; }
        .form-control, .form-select { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: #fff;
        }
        .form-control:focus, .form-select:focus {
            border-color: #003399;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,51,153,0.08);
        }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .form-text {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }
        .page-link-btn { 
            background: #fff; 
            border: 1px solid #ddd; 
            padding: 6px 14px; 
            border-radius: 8px; 
            color: #003399; 
            cursor: pointer; 
            font-size: 0.85rem;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .page-link-btn:hover { background: #f0f4ff; }
        .page-link-btn.active { 
            background: #003399; 
            color: #fff; 
            border-color: #003399; 
        }
        .page-link-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            background: #f5f5f5;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-notification { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            color: #fff; 
            padding: 14px 28px; 
            border-radius: 12px; 
            z-index: 1200; 
            display: none; 
            max-width: 420px; 
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: toastIn 0.4s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        .toast-info { background: #17a2b8; }
        .toast-warning { background: #ffc107; color: #003399; }

        /* ============================================================
           COMITE / CONSEIL / MINISTRE CARDS
           ============================================================ */
        .leader-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }
        .leader-card-item {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #f0f0f0;
        }
        .leader-card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }
        .leader-card-item .leader-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #003399, #0066CC);
        }
        .leader-card-item .leader-body {
            padding: 16px;
        }
        .leader-card-item .leader-body h5 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #003399;
            margin: 0 0 4px;
        }
        .leader-card-item .leader-body .leader-title {
            font-size: 0.8rem;
            color: #FFCC00;
            font-weight: 600;
            margin: 0 0 8px;
        }
        .leader-card-item .leader-body .leader-message {
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
            margin: 0 0 12px;
            line-height: 1.4;
        }
        .leader-card-item .leader-body .leader-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Style pour l'affichage du ministre */
        .ministre-card {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
        }
        .ministre-card .ministre-photo {
            flex: 0 0 200px;
            text-align: center;
        }
        .ministre-card .ministre-photo img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FFCC00;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .ministre-card .ministre-photo .no-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #003399, #0066CC);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: rgba(255,255,255,0.7);
            border: 4px solid #FFCC00;
        }
        .ministre-card .ministre-infos {
            flex: 1;
            min-width: 250px;
        }
        .ministre-card .ministre-infos table {
            width: 100%;
        }
        .ministre-card .ministre-infos table td {
            padding: 8px 12px 8px 0;
            border-bottom: 1px solid #eee;
        }

<script>
    // ============================================================
    // FONCTION TOGGLE MOT DE PASSE (utilisée partout)
    // ============================================================
    function togglePasswordVisibility(inputId, wrapperId) {
        const input = document.getElementById(inputId);
        const wrapper = document.getElementById(wrapperId);
        if (!input || !wrapper) return;
        
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        wrapper.classList.toggle('show-password');
    }

    // Initialiser les toggles pour les modales (créées dynamiquement)
    function initPasswordToggles() {
        document.querySelectorAll('.password-wrapper:not(.initialized)').forEach(wrapper => {
            wrapper.classList.add('initialized');
            const toggle = wrapper.querySelector('.password-toggle');
            const input = wrapper.querySelector('input[type="password"], input[type="text"]');
            if (toggle && input) {
                if (input.type !== 'password' && input.type !== 'text') {
                    input.type = 'password';
                }
                wrapper.classList.remove('show-password');
                if (input.type === 'text') {
                    input.type = 'password';
                }
            }
        });
    }

    // ============================================================
    // CONFIGURATION API
    // ============================================================
    const API_BASE = '../assets/php/api';
    let currentUser = null;
    let currentSection = 'dashboard';
    let currentPageActualites = 1;
    let currentPageDemandes = 1;
    let currentPageOffres = 1;
    const itemsPerPage = 10;
    const cache = { actualites: [], demandes: [], offres: [], comite: [], conseil: [], ministre: null, users: [], logs: [] };

    const sectionTitles = {
        dashboard: 'Dashboard',
        actualites: 'Gestion des Actualités',
        demandes: 'Demandes de Transport',
        offres: 'Offres de Transport',
        comite: 'Comité de Gestion',
        conseil: 'Conseil d\'Administration',
        ministre: 'Ministre des Transports',
        users: 'Gestion des utilisateurs',
        logs: 'Journal des modifications'
    };

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('loginForm').addEventListener('submit', login);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('changePasswordBtn').addEventListener('click', function() {
            openChangePasswordModal();
        });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                loadSection(this.dataset.section);
            });
        });
        
        initSidebarToggle();
        checkAuth();
        initPasswordToggles();
    });

    // Observer les mutations du DOM pour initialiser les toggles dans les modales
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length) {
                setTimeout(initPasswordToggles, 100);
            }
        });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    function initSidebarToggle() {
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        
        if (!sidebarToggle) return;
        
        sidebarToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
            this.setAttribute('aria-expanded', sidebar.classList.contains('open'));
        });
        
        sidebarOverlay.addEventListener('click', function() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            sidebarToggle.setAttribute('aria-expanded', 'false');
        });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                if (window.innerWidth <= 992) {
                    sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active');
                    sidebarToggle.setAttribute('aria-expanded', 'false');
                }
            });
        });
        
        window.addEventListener('resize', function() {
            if (window.innerWidth > 992) {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
                sidebarToggle.setAttribute('aria-expanded', 'false');
            }
        });
    }

    async function api(url, options = {}) {
        const isFormData = options.body instanceof FormData;
        const headers = isFormData
            ? { ...(options.headers || {}) }
            : { 'Content-Type': 'application/json', ...(options.headers || {}) };

        const response = await fetch(url, {
            credentials: 'include',
            ...options,
            headers
        });

        let data = null;
        try { data = await response.json(); } catch(e) { data = null; }

        if (!response.ok) {
            const msg = data?.message || 'Erreur serveur';
            throw new Error(msg);
        }
        return data;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function shortText(value, length = 55) {
        const text = String(value ?? '');
        return text.length > length ? escapeHtml(text.substring(0, length)) + '...' : escapeHtml(text);
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast-notification toast-${type}`;
        toast.style.display = 'block';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function safeArray(arr) {
        return Array.isArray(arr) ? arr : [];
    }

    async function login(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const result = await api(`${API_BASE}/auth.php?action=login`, {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            currentUser = result.user;
            showAdminPanel();
            await loadSection('dashboard');
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function checkAuth() {
        try {
            const result = await api(`${API_BASE}/auth.php?action=me`);
            if (result.user) {
                currentUser = result.user;
                showAdminPanel();
                await loadSection('dashboard');
            } else {
                showLoginPage();
            }
        } catch (error) {
            showLoginPage();
        }
    }

    function showAdminPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        
        const userLabel = document.getElementById('currentUserLabel');
        const isSuperAdmin = currentUser.role === 'SUPER_ADMIN';
        const roleLabel = isSuperAdmin ? 'SUPER ADMIN' : 'ADMIN';
        userLabel.innerHTML = `<strong>${escapeHtml(currentUser.nom)}</strong> <span class="role-badge">${roleLabel}</span>`;

        document.querySelectorAll('.super-only').forEach(el => {
            el.style.display = isSuperAdmin ? 'flex' : 'none';
        });
        
        const allowedSections = ['dashboard', 'actualites', 'comite', 'conseil'];
        if (!isSuperAdmin) {
            const currentSectionEl = document.querySelector('.nav-item.active');
            if (currentSectionEl) {
                const section = currentSectionEl.dataset.section;
                if (!allowedSections.includes(section)) {
                    loadSection('dashboard');
                }
            }
        }
    }

    function showLoginPage() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
    }

    async function logout() {
        try { await api(`${API_BASE}/auth.php?action=logout`); } catch(e) {}
        currentUser = null;
        showLoginPage();
    }

    async function loadSection(section) {
        if (currentUser && currentUser.role !== 'SUPER_ADMIN') {
            const allowedSections = ['dashboard', 'actualites', 'comite', 'conseil'];
            if (!allowedSections.includes(section)) {
                showToast('Accès réservé au Super Administrateur', 'error');
                return;
            }
        }
        
        if ((section === 'users' || section === 'logs' || section === 'ministre') && currentUser.role !== 'SUPER_ADMIN') {
            showToast('Accès réservé au Super Administrateur', 'error');
            return;
        }

        currentSection = section;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        document.querySelector(`.nav-item[data-section="${section}"]`)?.classList.add('active');
        document.getElementById('sectionTitle').textContent = sectionTitles[section] || 'Administration';
        document.getElementById('contentArea').innerHTML = '<div class="content-card">Chargement...</div>';

        try {
            if (section === 'dashboard') await renderDashboard();
            if (section === 'actualites') await renderActualites();
            if (section === 'demandes') await renderDemandes();
            if (section === 'offres') await renderOffres();
            if (section === 'comite') await renderComite();
            if (section === 'conseil') await renderConseil();
            if (section === 'ministre') await renderMinistre();
            if (section === 'users') await renderUsers();
            if (section === 'logs') await renderLogs();
        } catch (error) {
            document.getElementById('contentArea').innerHTML = `<div class="content-card text-danger">${escapeHtml(error.message)}</div>`;
        }
    }

    function renderPagination(type, currentPage, totalPages) {
        if (totalPages <= 1) return '';
        let html = `<button class="page-link-btn" onclick="changePage('${type}', ${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Précédent</button>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-link-btn ${i === currentPage ? 'active' : ''}" onclick="changePage('${type}', ${i})">${i}</button>`;
        }
        html += `<button class="page-link-btn" onclick="changePage('${type}', ${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Suivant</button>`;
        return html;
    }

    function changePage(type, page) {
        if (type === 'actualites') { currentPageActualites = page; renderActualites(); }
        if (type === 'demandes') { currentPageDemandes = page; renderDemandes(); }
        if (type === 'offres') { currentPageOffres = page; renderOffres(); }
    }

    function getModuleFromType(type) {
        return { actualite: 'actualites', demande: 'demandes', offre: 'offres', comite: 'comite', conseil: 'conseil', ministre: 'ministre' }[type];
    }

    function getSectionFromType(type) {
        return { actualite: 'actualites', demande: 'demandes', offre: 'offres', comite: 'comite', conseil: 'conseil', ministre: 'ministre', user: 'users' }[type];
    }

        if (!confirm('Confirmer la suppression ?')) return;
        try {
            const module = getModuleFromType(type);
            await api(`${API_BASE}/data.php?module=${module}&id=${id}`, { method: 'DELETE' });
            showToast('Suppression effectuée avec succès');
            await loadSection(getSectionFromType(type));
        } catch (error) {

    async function changePassword(e) {
        e.preventDefault();
        const newUsername = document.getElementById('newUsername').value.trim();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (!currentPassword) {
            showToast('Veuillez entrer votre mot de passe actuel', 'error');
            return;
        }
        if (newPassword && newPassword !== confirmPassword) {
            showToast('Les mots de passe ne correspondent pas', 'error');
            return;
        }
        if (!newUsername) {
            showToast('L\'identifiant ne peut pas être vide', 'error');
            return;
        }
        if (newPassword && newPassword.length < 4) {
            showToast('Le nouveau mot de passe doit contenir au moins 4 caractères', 'error');
            return;
        }
        
        try {
            const result = await api(`${API_BASE}/users.php?action=change_password`, {
                method: 'POST',
                body: JSON.stringify({
                    username: currentUser.username,
                    new_username: newUsername,
                    current_password: currentPassword,
                    new_password: newPassword || null
                })
            });
            if (result.success) {
                showToast('Identifiant et/ou mot de passe mis à jour avec succès !', 'success');
                closeModal();
                currentUser.username = newUsername;
                const userLabel = document.getElementById('currentUserLabel');
                const isSuperAdmin = currentUser.role === 'SUPER_ADMIN';
                userLabel.innerHTML = `<strong>${escapeHtml(currentUser.nom)}</strong> <span class="role-badge">${isSuperAdmin ? 'SUPER ADMIN' : 'ADMIN'}</span>`;
                if (newUsername !== currentUser.username || newPassword) {
                    setTimeout(() => {
                        if (confirm('Vos identifiants ont été modifiés. Vous allez être déconnecté pour utiliser les nouveaux.')) {
                            logout();
                        }
                    }, 1500);
                }
            } else {
                showToast(result.message || 'Erreur lors de la mise à jour', 'error');
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

        document.getElementById('dynamicModal')?.remove();

        if (type === 'user') {
            if (currentUser.role !== 'SUPER_ADMIN') return showToast('Accès refusé', 'error');
            modalHtml = `
            <div class="modal-custom active" id="dynamicModal"><div class="modal-content-custom">
                <div class="modal-header-custom"><h3>Créer un utilisateur</h3><button class="btn-close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
                <form id="modalForm">
                    <div class="form-group"><label>Nom <span class="required">*</span></label><input type="text" id="nom" class="form-control" required></div>
                    <div class="form-group"><label>Identifiant <span class="required">*</span></label><input type="text" id="usernameNew" class="form-control" required></div>
                    <div class="form-group">
                        <label>Mot de passe <span class="required">*</span></label>
                        <div class="password-wrapper" id="createUserPwdWrapper">
                            <input type="password" id="passwordNew" class="form-control" required>
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('passwordNew', 'createUserPwdWrapper')" aria-label="Afficher/masquer le mot de passe">
                                <i class="fas fa-eye"></i>
                                <i class="fas fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group"><label>Rôle <span class="required">*</span></label><select id="role" class="form-select"><option value="ADMIN">ADMIN</option><option value="SUPER_ADMIN">SUPER_ADMIN</option></select></div>
                    <button type="submit" class="btn-add" style="width:100%;padding:14px;justify-content:center;font-size:1rem;"><i class="fas fa-user-plus"></i> Créer</button>
                </form>
            </div></div>`;
        }

        document.body.insertAdjacentHTML('beforeend', modalHtml);
        document.getElementById('modalForm').addEventListener('submit', e => saveModal(e, type, item));
        setTimeout(initPasswordToggles, 100);
    }

    // ============================================================
    // SAVE MODAL
    // ============================================================
    async function saveModal(e, type, oldItem) {
        e.preventDefault();
        const formId = document.getElementById('itemId')?.value || '';
        let payload = {};
        let url = '';
        let method = formId ? 'PUT' : 'POST';

        try {
            // ACTUALITÉ
            if (type === 'actualite') {
                const formData = new FormData();
                if (formId) {
                    formData.append('id', formId);
                    formData.append('_method', 'PUT');
                }
                formData.append('titre', document.getElementById('titre').value);
                formData.append('date', document.getElementById('date').value);
                formData.append('categorie', document.getElementById('categorie').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('facebookUrl', document.getElementById('facebookUrl').value);
                formData.append('instagramUrl', document.getElementById('instagramUrl').value);
                formData.append('twitterUrl', document.getElementById('twitterUrl').value);
                formData.append('likes', document.getElementById('likes').value || 0);
                formData.append('replaceImages', document.getElementById('replaceImages')?.checked ? '1' : '0');

                const files = document.getElementById('images').files;
                for (const file of files) formData.append('images[]', file);

                if (!formId && files.length === 0) {
                    throw new Error('Sélectionnez au moins une image.');
                }
                if (formId && document.getElementById('replaceImages')?.checked && files.length === 0) {
                    throw new Error('Sélectionnez les nouvelles images avant de demander le remplacement.');
                }

                url = `${API_BASE}/data.php?module=actualites`;
                method = 'POST';
                await api(url, { method, body: formData });
                showToast('Actualité et images enregistrées');
                closeModal();
                await loadSection(getSectionFromType(type));
                return;
            }

            // COMITÉ - SAVE
            if (type === 'comite') {
                const formData = new FormData();
                if (formId) {
                    formData.append('id', formId);
                    formData.append('_method', 'PUT');
                }
                formData.append('nom', document.getElementById('nom').value);
                formData.append('titre', document.getElementById('titre').value);
                formData.append('message', document.getElementById('message').value || '');
                
                const photoFile = document.getElementById('photo')?.files[0];
                if (photoFile) {
                    formData.append('photo[]', photoFile);
                }
                
                url = `${API_BASE}/data.php?module=comite`;
                method = 'POST';
                await api(url, { method, body: formData });
                showToast('Membre enregistré avec succès');
                closeModal();
                await loadSection(getSectionFromType(type));
                return;
            }

            // CONSEIL - SAVE
            if (type === 'conseil') {
                const formData = new FormData();
                if (formId) {
                    formData.append('id', formId);
                    formData.append('_method', 'PUT');
                }
                formData.append('nom', document.getElementById('nom').value);
                formData.append('titre', document.getElementById('titre').value);
                formData.append('message', document.getElementById('message').value || '');
                
                const photoFile = document.getElementById('photo')?.files[0];
                if (photoFile) {
                    formData.append('photo[]', photoFile);
                }
                
                url = `${API_BASE}/data.php?module=conseil`;
                method = 'POST';
                await api(url, { method, body: formData });
                showToast('Membre enregistré avec succès');
                closeModal();
                await loadSection(getSectionFromType(type));
                return;
            }

            // ============================================================
            // MINISTRE - SAVE (réservé SUPER ADMIN)
            // ============================================================
            if (type === 'ministre') {
                const formData = new FormData();
                formData.append('id', document.getElementById('itemId').value || 1);
                formData.append('_method', 'PUT');
                formData.append('nom', document.getElementById('nom').value);
                formData.append('titre', document.getElementById('titre').value);
                formData.append('message', document.getElementById('message').value || '');
                
                const photoFile = document.getElementById('photo')?.files[0];
                if (photoFile) {
                    formData.append('photo[]', photoFile);
                }
                
                url = `${API_BASE}/data.php?module=ministre`;
                method = 'POST';
                await api(url, { method, body: formData });
                showToast('Ministre mis à jour avec succès');
                closeModal();
                await loadSection(getSectionFromType(type));
                return;
            }

            // DEMANDE
            if (type === 'demande') {
                payload = {
                    id: formId ? Number(formId) : undefined,
                    marchandises: document.getElementById('marchandises').value,
                    origine: document.getElementById('origine').value,
                    destination: document.getElementById('destination').value,
                    date: document.getElementById('date').value,
                    nom: document.getElementById('nom').value,
                    email: document.getElementById('email').value,
                    telephone: document.getElementById('telephone').value,
                    dateSoumission: oldItem?.dateSoumission || new Date().toLocaleString('fr-FR'),
                    statut: oldItem?.statut || 'publiée'
                };
                url = `${API_BASE}/data.php?module=demandes`;
            }

            // OFFRE
            if (type === 'offre') {
                payload = {
                    id: formId ? Number(formId) : undefined,
                    titre: document.getElementById('titre').value,
                    type: document.getElementById('type').value,
                    origine: document.getElementById('origine').value,
                    destination: document.getElementById('destination').value,
                    capacite: document.getElementById('capacite').value,
                    tarif: document.getElementById('tarif').value,
                    contact: document.getElementById('contact').value,
                    description: document.getElementById('description').value
                };
                url = `${API_BASE}/data.php?module=offres`;
            }

            // USER
            if (type === 'user') {
                payload = {
                    nom: document.getElementById('nom').value,
                    username: document.getElementById('usernameNew').value,
                    password: document.getElementById('passwordNew').value,
                    role: document.getElementById('role').value
                };
                url = `${API_BASE}/users.php`;
                method = 'POST';
            }

            await api(url, { method, body: JSON.stringify(payload) });
            showToast('Enregistrement effectué avec succès');
            closeModal();
            await loadSection(getSectionFromType(type));
        } catch (error) {
            console.error('Erreur saveModal:', error);
            showToast(error.message, 'error');
        }
    }

    // Exposer les fonctions globalement
    window.changePage = changePage;
    window.deleteItem = deleteItem;
    window.disableUser = disableUser;
    window.resetUserPassword = resetUserPassword;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.loadSection = loadSection;
    window.openChangePasswordModal = openChangePasswordModal;
    window.renderActualites = renderActualites;
    window.renderDemandes = renderDemandes;
    window.renderOffres = renderOffres;
    window.renderComite = renderComite;
    window.renderConseil = renderConseil;
    window.renderMinistre = renderMinistre;
    window.renderUsers = renderUsers;
    window.renderLogs = renderLogs;
    window.togglePasswordVisibility = togglePasswordVisibility;
    window.initPasswordToggles = initPasswordToggles;
</script>
