<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGEFREM - Administration</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, Arial, sans-serif; background: #f0f2f5; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #003399, #0066CC); padding: 20px; }
        .login-card { background: #fff; border-radius: 24px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,.2); }
        .login-card h2 { color: #003399; }
        .login-card .logo { text-align: center; margin-bottom: 30px; }
        .login-card .logo img { height: 60px; }
        .admin-wrapper { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 270px; background: #003399; color: #fff; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
        .admin-sidebar .logo { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: center; }
        .admin-sidebar .logo h3 { color: #FFCC00; font-size: 1.1rem; margin-top: 8px; }
        .admin-sidebar .nav-item { padding: 14px 25px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-left: 3px solid transparent; transition: .2s; }
        .admin-sidebar .nav-item:hover { background: rgba(255,255,255,.1); }
        .admin-sidebar .nav-item.active { background: rgba(255,204,0,.2); border-left-color: #FFCC00; }
        .admin-sidebar .nav-item i { width: 24px; }
        .super-only { display: none; }
        .admin-main { flex: 1; margin-left: 270px; padding: 20px 30px; }
        .admin-header { background: #fff; border-radius: 16px; padding: 15px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
        .admin-header h1 { font-size: 1.4rem; margin: 0; color: #003399; }
        .user-pill { background: #f8f9fa; border-radius: 999px; padding: 8px 14px; font-size: .9rem; margin-right: 10px; }
        .logout-btn { background: #dc3545; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .content-card { background: #fff; border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
        .card-header-custom { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #FFCC00; flex-wrap: wrap; gap: 15px; }
        .btn-add { background: #003399; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .btn-edit { background: #FFCC00; color: #003399; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background: #dc3545; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .btn-secondary-custom { background: #6c757d; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .modal-custom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal-custom.active { display: flex; }
        .modal-content-custom { background: #fff; border-radius: 24px; width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; padding: 30px; }
        .modal-header-custom { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-control, .form-select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; }
        textarea.form-control { resize: vertical; min-height: 110px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card-admin { background: #fff; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
        .stat-number-admin { font-size: 2rem; font-weight: 800; color: #FFCC00; }
        .data-table { width: 100%; overflow-x: auto; }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
        .data-table th { background: #f8f9fa; font-weight: 700; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: .75rem; font-weight: 700; }
        .badge-primary { background: #003399; color: #fff; }
        .badge-warning { background: #ffc107; color: #003399; }
        .badge-success { background: #198754; color: #fff; }
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999; }
        .search-box input { padding-left: 45px; border-radius: 50px; }
        .toast-notification { position: fixed; bottom: 20px; right: 20px; color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 1100; display: none; max-width: 420px; }
        .toast-success { background: #28a745; }
        .toast-error { background: #dc3545; }
        .page-link-btn { background: #fff; border: 1px solid #ddd; padding: 6px 12px; border-radius: 6px; color: #003399; cursor: pointer; margin: 0 2px; }
        .page-link-btn.active { background: #003399; color: #fff; border-color: #003399; }
        .page-link-btn:disabled { opacity: .5; cursor: not-allowed; }
        .image-preview { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; background: #f1f1f1; }
        @media (max-width: 768px) {
            .admin-sidebar { width: 0; transform: translateX(-100%); transition: .2s; }
            .admin-sidebar.open { width: 270px; transform: translateX(0); }
            .admin-main { margin-left: 0; padding: 15px; }
            .sidebar-toggle { display: inline-block; background: #003399; color: #fff; border: none; padding: 10px; border-radius: 8px; margin-right: 15px; }
        }
        @media (min-width: 769px) { .sidebar-toggle { display: none; } }
    </style>
</head>
<body>
<div id="app">
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <div class="logo">
                <img src="../assets/images/ogefrem_logo2.png" alt="OGEFREM" onerror="this.src='https://placehold.co/80x80/003399/white?text=OG'">
                <h2>Administration</h2>
                <p>OGEFREM - Portail de gestion</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Identifiant</label>
                    <input type="text" id="username" class="form-control" placeholder="superadmin, admin1, admin2, admin3" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn-add" style="width:100%; padding:12px;">Se connecter</button>
            </form>
        </div>
    </div>

    <div id="adminPanel" style="display:none;">
        <div class="admin-wrapper">
            <div class="admin-sidebar" id="sidebar">
                <div class="logo">
                    <img src="../assets/images/ogefrem_logo2.png" alt="OGEFREM" onerror="this.src='https://placehold.co/40x40/003399/white?text=OG'" style="height:40px;">
                    <h3>OGEFREM Admin</h3>
                </div>
                <div class="nav-item active" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
                <div class="nav-item" data-section="actualites"><i class="fas fa-newspaper"></i> Actualités</div>
                <div class="nav-item" data-section="demandes"><i class="fas fa-file-signature"></i> Demandes de transport</div>
                <div class="nav-item" data-section="offres"><i class="fas fa-tags"></i> Offres de transport</div>
                <div class="nav-item" data-section="comite"><i class="fas fa-users"></i> Comité de Gestion</div>
                <div class="nav-item" data-section="conseil"><i class="fas fa-user-tie"></i> Conseil d'Administration</div>
                <div class="nav-item super-only" data-section="users"><i class="fas fa-user-shield"></i> Utilisateurs</div>
                <div class="nav-item super-only" data-section="logs"><i class="fas fa-history"></i> Logs</div>
            </div>

            <div class="admin-main">
                <div class="admin-header">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                        <h1 id="sectionTitle">Dashboard</h1>
                    </div>
                    <div>
                        <span class="user-pill" id="currentUserLabel"></span>
                        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
                    </div>
                </div>
                <div id="contentArea"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast-notification"></div>

<script>
    const API_BASE = '../assets/php/api';
    let currentUser = null;
    let currentSection = 'dashboard';
    let currentPageActualites = 1;
    let currentPageDemandes = 1;
    let currentPageOffres = 1;
    const itemsPerPage = 10;
    const cache = { actualites: [], demandes: [], offres: [], comite: [], conseil: [], users: [], logs: [] };

    const sectionTitles = {
        dashboard: 'Dashboard',
        actualites: 'Gestion des Actualités',
        demandes: 'Demandes de Transport',
        offres: 'Offres de Transport',
        comite: 'Comité de Gestion',
        conseil: 'Conseil d\'Administration',
        users: 'Gestion des utilisateurs',
        logs: 'Journal des modifications'
    };

    document.getElementById('loginForm').addEventListener('submit', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => loadSection(item.dataset.section));
    });

    async function api(url, options = {}) {
        const isFormData = options.body instanceof FormData;
        const headers = isFormData
            ? { ...(options.headers || {}) }
            : { 'Content-Type': 'application/json', ...(options.headers || {}) };

        const response = await fetch(url, {
            credentials: 'include',
            ...options,
            headers
        });

        let data = null;
        try { data = await response.json(); } catch(e) { data = null; }

        if (!response.ok) {
            const msg = data?.message || 'Erreur serveur';
            throw new Error(msg);
        }
        return data;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function shortText(value, length = 55) {
        const text = String(value ?? '');
        return text.length > length ? escapeHtml(text.substring(0, length)) + '...' : escapeHtml(text);
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast-notification toast-${type}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3500);
    }

    async function login(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const result = await api(`${API_BASE}/auth.php?action=login`, {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            currentUser = result.user;
            showAdminPanel();
            await loadSection('dashboard');
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function checkAuth() {
        try {
            const result = await api(`${API_BASE}/auth.php?action=me`);
            if (result.user) {
                currentUser = result.user;
                showAdminPanel();
                await loadSection('dashboard');
            } else {
                showLoginPage();
            }
        } catch (error) {
            showLoginPage();
        }
    }

    function showAdminPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('currentUserLabel').innerHTML = `<strong>${escapeHtml(currentUser.nom)}</strong> - ${escapeHtml(currentUser.role)}`;

        document.querySelectorAll('.super-only').forEach(el => {
            el.style.display = currentUser.role === 'SUPER_ADMIN' ? 'flex' : 'none';
        });
    }

    function showLoginPage() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
    }

    async function logout() {
        try { await api(`${API_BASE}/auth.php?action=logout`); } catch(e) {}
        currentUser = null;
        showLoginPage();
    }

    async function loadSection(section) {
        if ((section === 'users' || section === 'logs') && currentUser.role !== 'SUPER_ADMIN') {
            showToast('Accès réservé au super utilisateur', 'error');
            return;
        }

        currentSection = section;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        document.querySelector(`.nav-item[data-section="${section}"]`)?.classList.add('active');
        document.getElementById('sectionTitle').textContent = sectionTitles[section] || 'Administration';
        document.getElementById('contentArea').innerHTML = '<div class="content-card">Chargement...</div>';

        try {
            if (section === 'dashboard') await renderDashboard();
            if (section === 'actualites') await renderActualites();
            if (section === 'demandes') await renderDemandes();
            if (section === 'offres') await renderOffres();
            if (section === 'comite') await renderComite();
            if (section === 'conseil') await renderConseil();
            if (section === 'users') await renderUsers();
            if (section === 'logs') await renderLogs();
        } catch (error) {
            document.getElementById('contentArea').innerHTML = `<div class="content-card text-danger">${escapeHtml(error.message)}</div>`;
        }
    }

    async function loadPublicData() {
        const [actualites, demandes, offres, comite, conseil] = await Promise.all([
            api(`${API_BASE}/data.php?module=actualites`),
            api(`${API_BASE}/data.php?module=demandes`),
            api(`${API_BASE}/data.php?module=offres`),
            api(`${API_BASE}/data.php?module=comite`),
            api(`${API_BASE}/data.php?module=conseil`)
        ]);
        cache.actualites = actualites;
        cache.demandes = demandes;
        cache.offres = offres;
        cache.comite = comite;
        cache.conseil = conseil;
    }

    async function renderDashboard() {
        await loadPublicData();
        const membresComite = cache.comite.filter(m => 
            m.titre === 'Directeur Général' || 
            m.titre === 'Directeur Général Adjoint'
        );
        const totalMembres = membresComite.length + (cache.conseil?.length || 0);
        document.getElementById('contentArea').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card-admin"><div class="stat-number-admin">${cache.actualites.length}</div><div>Actualités</div></div>
                <div class="stat-card-admin"><div class="stat-number-admin">${cache.demandes.length}</div><div>Demandes</div></div>
                <div class="stat-card-admin"><div class="stat-number-admin">${cache.offres.length}</div><div>Offres</div></div>
                <div class="stat-card-admin"><div class="stat-number-admin">${totalMembres}</div><div>Membres (Comité + CA)</div></div>
            </div>
            <div class="content-card">
                <div class="card-header-custom"><h3><i class="fas fa-newspaper"></i> Dernières actualités</h3><button class="btn-add" onclick="loadSection('actualites')">Gérer tout</button></div>
                <div class="data-table"><table><thead><tr><th>Titre</th><th>Date</th><th>Catégorie</th></tr></thead><tbody>
                    ${cache.actualites.slice(0,5).map(a => `<tr><td>${shortText(a.titre, 70)}</td><td>${escapeHtml(a.date)}</td><td>${escapeHtml(a.categorie)}</td></tr>`).join('') || '<tr><td colspan="3">Aucune actualité</td></tr>'}
                </tbody></table></div>
            </div>
        `;
    }

    async function renderActualites() {
        cache.actualites = await api(`${API_BASE}/data.php?module=actualites`);
        const totalPages = Math.max(1, Math.ceil(cache.actualites.length / itemsPerPage));
        currentPageActualites = Math.min(currentPageActualites, totalPages);
        const start = (currentPageActualites - 1) * itemsPerPage;
        const paginated = cache.actualites.slice(start, start + itemsPerPage);

        document.getElementById('contentArea').innerHTML = `
            <div class="content-card">
                <div class="card-header-custom">
                    <h3><i class="fas fa-newspaper"></i> Actualités <span class="badge badge-primary">${cache.actualites.length}</span></h3>
                    <button class="btn-add" onclick="openModal('actualite')"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <div class="search-box"><i class="fas fa-search"></i><input type="text" class="form-control" id="searchActualites" placeholder="Rechercher une actualité..."></div>
                <div class="data-table"><table><thead><tr><th>Titre</th><th>Date</th><th>Catégorie</th><th>Likes</th><th>Actions</th></tr></thead><tbody id="actualitesTableBody">
                    ${paginated.map(a => `<tr><td>${shortText(a.titre)}</td><td>${escapeHtml(a.date)}</td><td>${escapeHtml(a.categorie)}</td><td>${a.likes || 0}</td><td><button class="btn-edit" onclick="openModal('actualite', ${a.id})"><i class="fas fa-edit"></i></button><button class="btn-delete" onclick="deleteItem('actualite', ${a.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('') || '<tr><td colspan="5">Aucune actualité</td></tr>'}
                </tbody></table></div>
                <div class="mt-3">${renderPagination('actualites', currentPageActualites, totalPages)}</div>
            </div>`;

        document.getElementById('searchActualites').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('#actualitesTableBody tr').forEach(row => row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none');
        });
    }

    async function renderDemandes() {
        cache.demandes = await api(`${API_BASE}/data.php?module=demandes`);
        const totalPages = Math.max(1, Math.ceil(cache.demandes.length / itemsPerPage));
        currentPageDemandes = Math.min(currentPageDemandes, totalPages);
        const start = (currentPageDemandes - 1) * itemsPerPage;
        const paginated = cache.demandes.slice(start, start + itemsPerPage);

        document.getElementById('contentArea').innerHTML = `
            <div class="content-card">
                <div class="card-header-custom">
                    <h3><i class="fas fa-file-signature"></i> Demandes de transport <span class="badge badge-primary">${cache.demandes.length}</span></h3>
                    <button class="btn-add" onclick="openModal('demande')"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <div class="data-table"><table><thead><tr><th>Marchandises</th><th>Origine</th><th>Destination</th><th>Date</th><th>Demandeur</th><th>Actions</th></tr></thead><tbody>
                    ${paginated.map(d => `<tr><td>${shortText(d.marchandises)}</td><td>${escapeHtml(d.origine)}</td><td>${escapeHtml(d.destination)}</td><td>${escapeHtml(d.date)}</td><td>${escapeHtml(d.nom)}</td><td><button class="btn-edit" onclick="openModal('demande', ${d.id})"><i class="fas fa-edit"></i></button><button class="btn-delete" onclick="deleteItem('demande', ${d.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('') || '<tr><td colspan="6">Aucune demande</td></tr>'}
                </tbody></table></div>
                <div class="mt-3">${renderPagination('demandes', currentPageDemandes, totalPages)}</div>
            </div>`;
    }

    async function renderOffres() {
        cache.offres = await api(`${API_BASE}/data.php?module=offres`);
        const totalPages = Math.max(1, Math.ceil(cache.offres.length / itemsPerPage));
        currentPageOffres = Math.min(currentPageOffres, totalPages);
        const start = (currentPageOffres - 1) * itemsPerPage;
        const paginated = cache.offres.slice(start, start + itemsPerPage);

        document.getElementById('contentArea').innerHTML = `
            <div class="content-card">
                <div class="card-header-custom">
                    <h3><i class="fas fa-tags"></i> Offres de transport <span class="badge badge-primary">${cache.offres.length}</span></h3>
                    <button class="btn-add" onclick="openModal('offre')"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <div class="data-table"><table><thead><tr><th>Titre</th><th>Type</th><th>Trajet</th><th>Tarif</th><th>Actions</th></tr></thead><tbody>
                    ${paginated.map(o => `<tr><td>${shortText(o.titre)}</td><td>${escapeHtml(o.type)}</td><td>${escapeHtml(o.origine)} → ${escapeHtml(o.destination)}</td><td>${escapeHtml(o.tarif || '-')}</td><td><button class="btn-edit" onclick="openModal('offre', ${o.id})"><i class="fas fa-edit"></i></button><button class="btn-delete" onclick="deleteItem('offre', ${o.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('') || '<tr><td colspan="5">Aucune offre</td></tr>'}
                </tbody></table></div>
                <div class="mt-3">${renderPagination('offres', currentPageOffres, totalPages)}</div>
            </div>`;
    }

    // ===== COMITÉ DE GESTION : FILTRER POUR GARDER UNIQUEMENT DG ET DGA =====
    async function renderComite() {
        cache.comite = await api(`${API_BASE}/data.php?module=comite`);
        
        // Filtrer : garder uniquement DG et DGA
        const membresFiltres = cache.comite.filter(m => 
            m.titre === 'Directeur Général' || 
            m.titre === 'Directeur Général Adjoint'
        );
        
        document.getElementById('contentArea').innerHTML = `
            <div class="content-card">
                <div class="card-header-custom">
                    <h3><i class="fas fa-users"></i> Comité de Gestion <span class="badge badge-primary">${membresFiltres.length}</span></h3>
                    <button class="btn-add" onclick="openModal('comite')"><i class="fas fa-plus"></i> Ajouter</button>
                </div>
                <div class="row">
                    ${membresFiltres.map(m => `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100">
                                <img src="../${escapeHtml(m.photo)}" class="card-img-top" style="height:260px; object-fit:cover;" onerror="this.src='https://placehold.co/400x300/003399/white?text=Photo'">
                                <div class="card-body">
                                    <h5>${escapeHtml(m.nom)}</h5>
                                    <p class="text-muted">${escapeHtml(m.titre)}</p>
                                    ${m.message ? `<p class="small text-muted">"${escapeHtml(m.message)}"</p>` : ''}
                                    <button class="btn-edit" onclick="openModal('comite', ${m.id})"><i class="fas fa-edit"></i> Modifier</button>
                                    <button class="btn-delete" onclick="deleteItem('comite', ${m.id})"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>`).join('') || '<p>Aucun membre enregistré.</p>'}
                </div>
            </div>`;
    }

    // ===== CONSEIL D'ADMINISTRATION =====

                    ${cache.logs.map(l => `<tr><td>${escapeHtml(l.created_at)}</td><td>${escapeHtml(l.nom || l.username || 'Système')}</td><td>${escapeHtml(l.action)}</td><td>${escapeHtml(l.module)}</td><td>${escapeHtml(l.item_id || '')}</td><td>${shortText(l.details || '', 80)}</td><td>${escapeHtml(l.ip_address || '')}</td></tr>`).join('') || '<tr><td colspan="7">Aucun log.</td></tr>'}

    function renderPagination(type, currentPage, totalPages) {
        if (totalPages <= 1) return '';
        let html = `<button class="page-link-btn" onclick="changePage('${type}', ${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Précédent</button>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-link-btn ${i === currentPage ? 'active' : ''}" onclick="changePage('${type}', ${i})">${i}</button>`;
        }
        html += `<button class="page-link-btn" onclick="changePage('${type}', ${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Suivant</button>`;
        return html;
    }

    function changePage(type, page) {
        if (type === 'actualites') { currentPageActualites = page; renderActualites(); }
        if (type === 'demandes') { currentPageDemandes = page; renderDemandes(); }
        if (type === 'offres') { currentPageOffres = page; renderOffres(); }
    }

    function getModuleFromType(type) {
        return { actualite: 'actualites', demande: 'demandes', offre: 'offres', comite: 'comite', conseil: 'conseil' }[type];
    }

    function getSectionFromType(type) {
        return { actualite: 'actualites', demande: 'demandes', offre: 'offres', comite: 'comite', conseil: 'conseil', user: 'users' }[type];
    }

    async function deleteItem(type, id) {
        if (!confirm('Confirmer la suppression ?')) return;
        try {
            const module = getModuleFromType(type);
            await api(`${API_BASE}/data.php?module=${module}&id=${id}`, { method: 'DELETE' });
            showToast('Suppression effectuée avec succès');
            await loadSection(getSectionFromType(type));
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function disableUser(id) {
        if (!confirm('Désactiver cet utilisateur ?')) return;
        try {
            await api(`${API_BASE}/users.php?id=${id}`, { method: 'DELETE' });
            showToast('Utilisateur désactivé');
            await renderUsers();
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function saveModal(e, type, oldItem) {
        e.preventDefault();
        const formId = document.getElementById('itemId')?.value || '';
        let payload = {};
        let url = '';
        let method = formId ? 'PUT' : 'POST';

        try {
            if (type === 'actualite') {
                const formData = new FormData();
                if (formId) {
                    formData.append('id', formId);
                    formData.append('_method', 'PUT');
                }
                formData.append('titre', document.getElementById('titre').value);
                formData.append('date', document.getElementById('date').value);
                formData.append('categorie', document.getElementById('categorie').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('facebookUrl', document.getElementById('facebookUrl').value);
                formData.append('instagramUrl', document.getElementById('instagramUrl').value);
                formData.append('twitterUrl', document.getElementById('twitterUrl').value);
                formData.append('replaceImages', document.getElementById('replaceImages')?.checked ? '1' : '0');

                const files = document.getElementById('images').files;
                for (const file of files) formData.append('images[]', file);

                if (!formId && files.length === 0) {
                    throw new Error('Sélectionnez au moins une image.');
                }
                if (formId && document.getElementById('replaceImages')?.checked && files.length === 0) {
                    throw new Error('Sélectionnez les nouvelles images avant de demander le remplacement.');
                }

                url = `${API_BASE}/data.php?module=actualites`;
                method = 'POST';
                await api(url, { method, body: formData });
                showToast('Actualité et images enregistrées dans MySQL');
                closeModal();
                await loadSection(getSectionFromType(type));
                return;
            }

            if (type === 'demande') {
                payload = {
                    id: formId ? Number(formId) : undefined,
                    marchandises: document.getElementById('marchandises').value,
                    origine: document.getElementById('origine').value,
                    destination: document.getElementById('destination').value,
                    date: document.getElementById('date').value,
                    nom: document.getElementById('nom').value,
                    email: document.getElementById('email').value,
                    telephone: document.getElementById('telephone').value,
                    dateSoumission: oldItem?.dateSoumission || new Date().toLocaleString('fr-FR'),
                    statut: oldItem?.statut || 'publiée'
                };
                url = `${API_BASE}/data.php?module=demandes`;
            }

            if (type === 'offre') {
                payload = {
                    id: formId ? Number(formId) : undefined,
                    titre: document.getElementById('titre').value,
                    type: document.getElementById('type').value,
                    origine: document.getElementById('origine').value,
                    destination: document.getElementById('destination').value,
                    capacite: document.getElementById('capacite').value,
                    tarif: document.getElementById('tarif').value,
                    contact: document.getElementById('contact').value,
                    description: document.getElementById('description').value
                };
                url = `${API_BASE}/data.php?module=offres`;
            }

            if (type === 'comite') {
                payload = {
                    id: formId ? Number(formId) : undefined,
                    nom: document.getElementById('nom').value,
                    titre: document.getElementById('titre').value,
                    photo: document.getElementById('photo').value,
                    message: document.getElementById('message').value
                };
                url = `${API_BASE}/data.php?module=comite`;
            }

            if (type === 'conseil') {
                payload = {
                    id: formId ? Number(formId) : undefined,
                    nom: document.getElementById('nom').value,
                    titre: document.getElementById('titre').value,
                    photo: document.getElementById('photo').value,
                    message: document.getElementById('message').value
                };
                url = `${API_BASE}/data.php?module=conseil`;
            }

            if (type === 'user') {
                payload = {
                    nom: document.getElementById('nom').value,
                    username: document.getElementById('usernameNew').value,
                    password: document.getElementById('passwordNew').value,
                    role: document.getElementById('role').value
                };
                url = `${API_BASE}/users.php`;
                method = 'POST';
            }

            await api(url, { method, body: JSON.stringify(payload) });
            showToast('Enregistrement effectué avec succès');
            closeModal();
            await loadSection(getSectionFromType(type));
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    function closeModal() {
        document.getElementById('dynamicModal')?.remove();
    }

    window.changePage = changePage;
    window.deleteItem = deleteItem;
    window.disableUser = disableUser;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.loadSection = loadSection;

    checkAuth();
</script>
